# The plugin's manifest, read by the host before any of its code runs.
name: teams
title: Publish to Microsoft Teams
description: "Publish a blueprint or a top-level doc to a Microsoft Teams channel as one message, edited in place when the file changes, signed in as you and only when you ask"
version: 0.1.1
min_host: 0.18.0
settings:
  - name: destinations
    type: structured
    scope: root
    default: []
    meaning: 'the channels this root publishes to: each a name and the channel read from its link'
  - name: reply
    type: checkbox
    scope: root
    default: true
    meaning: reply in the message's thread when an edit is big enough, so people find out
  - name: reply_min_chars
    type: number
    scope: root
    default: 120
    meaning: the characters added and removed in a message that make an edit big enough to reply; a heading added, removed, or renamed always is
  - name: client_id
    type: text
    scope: me
    default: ''
    meaning: "your organization's own Microsoft Entra app, in place of The Virtual Panda's"
  - name: tenant
    type: text
    scope: me
    default: ''
    meaning: "the Microsoft Entra tenant to sign in to; empty, any work or school account's"
